<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <div
      class="card p-4 shadow rounded-4"
      style="max-width: 380px; width: 100%"
    >
      <h1 class="text-center fw-bold mb-4">SIMPUS-Mini</h1>
      <section>
        <form class="js-form-login" action="index.php">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              class="form-control"
              type="text"
              id="username"
              name="username"
              placeholder="Your usernmae"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              class="form-control"
              type="password"
              id="password"
              name="password"
              placeholder="password"
              required
            />
          </div>
          <div class="text-end mb-3">
            <a href="" class="text-decoration-none small">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100 js-btn-login">
            Masuk
          </button>
        </form>
      </section>
    </div>
    <script src="assets/js/login.js"></script>
  </body>
</html>
